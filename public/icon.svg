    <rect x="104" y="140" width="16" height="70" fill="#ffffff" rx="4"/>
    <rect x="134" y="140" width="8" height="70" fill="#ffffff" rx="4"/>
    <rect x="156" y="140" width="22" height="70" fill="#ffffff" rx="4"/>
    <rect x="192" y="140" width="12" height="70" fill="#ffffff" rx="4"/>
    <rect x="218" y="140" width="18" height="70" fill="#ffffff" rx="4"/>
